# Example camera configuration. Replace the zone with one drawn on real
# queue footage: python ai_engine/tools/draw_zone.py --video <clip> --config <this file>
camera_id: example_queue
description: Example queue zone (replace with a real one)
queue_zone:            # polygon, normalized 0-1 coordinates (x, y), clockwise
  - [0.20, 0.35]
  - [0.80, 0.35]
  - [0.90, 0.95]
  - [0.10, 0.95]
membership:
  min_dwell_seconds: 3.0               # must stay in the zone this long to count
  max_speed_heights_per_second: 0.5    # foot-point speed / box height
  exit_grace_seconds: 1.5              # tolerate brief exits and occlusion
smoothing:
  window_seconds: 2.0                  # median filter on the queue length
service_line:          # head of the queue: a person who crosses this line counts as served
  - [0.15, 0.90]       # (use service_zone: [[x, y], ...] instead for a counter area; not both)
  - [0.85, 0.90]
stitching:             # re-link a person whose track ID changed inside the queue zone
  enabled: true
  max_gap_seconds: 2.0                 # longest disappearance that can be bridged
  max_distance_heights: 1.0            # max foot-point jump, in box heights
service_rate:          # people served per minute, used to predict the wait
  method: window                       # "window" (moving window) or "ewma"
  window_seconds: 300.0                # window length (also the low/high range horizon)
  ewma_time_constant_seconds: 120.0    # only used by "ewma"
  min_history_seconds: 60.0            # no estimate before this much video has passed
  min_services: 2                      # ...or before this many people were served
alerts:                # congestion alerts; null disables a threshold
  max_queue_length: 8                  # alert when the queue is longer than this
  max_predicted_wait_seconds: 300      # alert when the predicted wait exceeds this
  min_duration_seconds: 10.0           # condition must hold this long to start/end an alert
  cooldown_seconds: 60.0               # no new alert this soon after one ended
