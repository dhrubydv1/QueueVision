[project]
name = "queuevision"
version = "0.2.0"
description = "AI-based queue length and waiting-time estimation (AI engine)"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # en dashes/multiplication signs in docstrings are intentional
    "RUF002",
    "RUF003",
    "UP042",  # keep (str, Enum): StrEnum would change str()/format() output of MemberStatus
]

[tool.ruff.lint.isort]
known-first-party = ["ai_engine", "tests"]

[tool.ruff.format]
quote-style = "double"
